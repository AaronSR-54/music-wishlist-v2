<!-- PWA Meta Tags -->
<!-- Reference snippet. The real tags live in src/index.html. The theme-color is
     a single managed meta updated at runtime by ThemeService (and by the inline
     bootstrap script before Angular loads) to match the active light/dark theme. -->
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="icon" href="/icons/icon-192x192.png" type="image/png" sizes="192x192">
<link rel="icon" href="/icons/icon-512x512.png" type="image/png" sizes="512x512">
<link rel="apple-touch-icon" href="/icons/icon-180x180.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#22201f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Music Wishlist">
